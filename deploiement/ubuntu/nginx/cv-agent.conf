# CV Agent Pro — reverse-proxy Nginx.
#
# Ce fichier est le modèle posé par installer-https.sh, qui y remplace
# __DOMAINE__ puis laisse certbot injecter le bloc TLS (écoute 443, chemins des
# certificats, redirection depuis le port 80).
#
# À installer dans /etc/nginx/sites-available/cv-agent, activé par un lien
# symbolique dans /etc/nginx/sites-enabled/.
#
# RAPPEL : une fois le proxy en place, l'application ne doit plus être joignable
# directement sur le port 6060 depuis le réseau — sinon le HTTPS se contourne en
# tapant l'adresse et le port. Voir la section « fermeture du port » du guide.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINE__;

    # Journaux dédiés : sépare le trafic applicatif du reste du serveur.
    access_log /var/log/nginx/cv-agent.access.log;
    error_log  /var/log/nginx/cv-agent.error.log;

    # Les CV sont des pièces jointes parfois volumineuses ; la valeur par défaut
    # de Nginx (1 Mo) rejetterait les imports avec une erreur 413 peu parlante.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:6060;
        proxy_http_version 1.1;

        # En-têtes de transmission classiques (traçabilité, journaux, IP réelle).
        # À noter : l'application ne les INTERPRÈTE pas — uvicorn tourne sans
        # --proxy-headers. C'est la variable CV_AGENT_HTTPS_ONLY=1 qui pose le
        # drapeau Secure sur le cookie, pas X-Forwarded-Proto. Ne comptez donc
        # pas sur cet en-tête pour « passer l'application en HTTPS ».
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Un cycle de collecte déclenché depuis l'interface (« Lancer maintenant »)
        # peut dépasser la minute par défaut : sans ces valeurs, Nginx coupe la
        # requête avec une 504 alors que le traitement se poursuit côté serveur.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Réponses en flux (téléchargement de CV) non tamponnées par Nginx.
        proxy_buffering off;
    }

    # Fichiers statiques : servis tels quels, avec un cache court. L'application
    # ajoute un paramètre de version (asset_v) aux URL, ce qui casse le cache à
    # chaque déploiement — inutile d'aller au-delà de quelques heures.
    location /static/ {
        proxy_pass http://127.0.0.1:6060/static/;
        proxy_set_header Host $host;
        expires 2h;
        add_header Cache-Control "public";
    }
}
