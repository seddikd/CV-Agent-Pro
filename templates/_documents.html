<h3>Documents</h3>

<style scoped>
  .doc-item { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
              padding: .5rem 0; border-bottom: 1px solid rgba(128,128,128,.2); }
  .doc-item:last-of-type { border-bottom: none; }
  .doc-type { font-weight: 600; }
  .doc-name { flex: 1 1 auto; word-break: break-word; }
  .doc-actions { display: flex; gap: .4rem; margin-left: auto; }
  .doc-form { margin-top: .8rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .doc-form select, .doc-form input[type=file] { max-width: 100%; }
</style>

<div class="docs-list">
  {% if documents %}
    {% for d in documents %}
    <div class="doc-item">
      <span class="doc-type small">{{ d.doc_type or "Autre" }}</span>
      <span class="doc-name">{{ d.filename }}</span>
      <span class="doc-date small muted">{{ d.uploaded_at }}</span>
      <span class="doc-actions">
        <a class="btn small" href="/document/{{ d.id }}">Télécharger</a>
        <button type="button" class="btn small"
                hx-post="/document/{{ d.id }}/delete"
                hx-target="#documents"
                hx-swap="innerHTML"
                hx-confirm="Supprimer ce document ?">Supprimer</button>
      </span>
    </div>
    {% endfor %}
  {% else %}
    <p class="muted small">Aucun document pour l'instant.</p>
  {% endif %}
</div>

<form class="doc-form"
      hx-post="/candidate/{{ cid }}/documents"
      hx-target="#documents"
      hx-encoding="multipart/form-data"
      hx-swap="innerHTML"
      hx-on::after-request="this.reset()">
  <input type="file" name="fichier" required>
  <select name="doc_type">
    {% for t in doc_types %}
    <option value="{{ t }}">{{ t }}</option>
    {% endfor %}
  </select>
  <button type="submit" class="btn primary small">Ajouter</button>
</form>
